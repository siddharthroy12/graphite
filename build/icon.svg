<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Graphite's app mark: a carbon ring.

    Graphite is carbon in hexagonal rings, so six atoms and their bonds are the
    literal thing the app is named after. Pointy-top hexagon (vertical left and
    right bonds), drawn as one high-contrast shape so it still reads at 16px.

    Geometry: circumradius 250 about (512, 512). In a regular hexagon the side
    equals the circumradius, so every bond spans the same 250 units and each is
    inset 62 at both ends — the atom radius (52) plus a 10 unit gap.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f1f4" />
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#tile)" />
  <rect
    x="66" y="66" width="892" height="892" rx="200"
    fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="4"
  />

  <g stroke="#17171a" stroke-width="26" stroke-linecap="round">
    <line x1="565.69" y1="293.00" x2="674.81" y2="356.00" />
    <line x1="728.51" y1="449.00" x2="728.51" y2="575.00" />
    <line x1="674.81" y1="668.00" x2="565.69" y2="731.00" />
    <line x1="458.31" y1="731.00" x2="349.19" y2="668.00" />
    <line x1="295.49" y1="575.00" x2="295.49" y2="449.00" />
    <line x1="349.19" y1="356.00" x2="458.31" y2="293.00" />
  </g>

  <g fill="#17171a">
    <circle cx="512.00" cy="262.00" r="52" />
    <circle cx="728.51" cy="387.00" r="52" />
    <circle cx="728.51" cy="637.00" r="52" />
    <circle cx="512.00" cy="762.00" r="52" />
    <circle cx="295.49" cy="637.00" r="52" />
    <circle cx="295.49" cy="387.00" r="52" />
  </g>
</svg>
