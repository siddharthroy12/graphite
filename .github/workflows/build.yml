name: Build

# Pull requests get a fast typecheck + build. Pushes to main additionally
# package and upload installers for all three desktop platforms, so a
# downloadable build is always available without tagging. Pushing a v* tag does
# the same and also attaches the installers to the GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Attaching installers to a Release needs write access to contents.
permissions:
  contents: write

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` runs the postinstall electron-rebuild for better-sqlite3, which
      # needs a C/C++ toolchain — present on ubuntu-latest by default.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  package:
    name: Package ${{ matrix.platform }}
    needs: check
    # Packaging all three OSes is slow; skip it on pull requests, where the
    # check job above already proves the app compiles.
    if: github.event_name != 'pull_request'
    strategy:
      # One OS failing shouldn't throw away the others' installers.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # Pinned to 2022: the native better-sqlite3 rebuild needs Visual
          # Studio with the C++ workload, and the node-gyp bundled here fails to
          # detect it on the newer windows-latest (2025) image.
          - os: windows-2022
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `dist:<platform>` runs `electron-vite build` then packages with
      # electron-builder. The app is unsigned (no identity configured).
      - name: Package
        run: npm run dist:${{ matrix.platform }}
        env:
          # Lets electron-builder authenticate if a step ever needs GitHub.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: graphite-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
