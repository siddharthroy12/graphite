name: Build

# Pull requests get a fast typecheck + build. Pushes to main additionally
# package and upload installers for all three desktop platforms, so a
# downloadable build is always available without tagging. Pushing a v* tag does
# the same and also attaches the installers to the GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Attaching installers to a Release needs write access to contents.
permissions:
  contents: write

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips better-sqlite3's install script, which would
      # otherwise try to build the module for *host node* and fall back to a
      # source compile (node-gyp fails under Python 3.12, which dropped
      # distutils). Typecheck and build don't need the native binary — the main
      # process externalizes better-sqlite3 — so no rebuild is required here.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  package:
    name: Package ${{ matrix.platform }}
    needs: check
    # Packaging all three OSes is slow; skip it on pull requests, where the
    # check job above already proves the app compiles.
    if: github.event_name != 'pull_request'
    strategy:
      # One OS failing shouldn't throw away the others' installers.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # better-sqlite3 now installs from a prebuilt binary (no compiler
          # needed), so the runner image is not sensitive to the Visual Studio
          # version; kept on 2022 as a known-good, stable image.
          - os: windows-2022
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip better-sqlite3's host-node install build (see the check job), then
      # let electron-builder fetch the module's prebuilt binary for this Electron
      # ABI (electron-v136). @electron/rebuild downloads the prebuilt rather than
      # compiling, so no C/C++ toolchain (Visual Studio, etc.) is needed.
      - run: npm ci --ignore-scripts
      - run: npx electron-builder install-app-deps

      # `dist:<platform>` runs `electron-vite build` then packages with
      # electron-builder. Its afterPack hook ad-hoc-signs the macOS bundle,
      # including nested Electron code, without an Apple Developer certificate.
      - name: Package
        run: npm run dist:${{ matrix.platform }}
        env:
          # Lets electron-builder authenticate if a step ever needs GitHub.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: graphite-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
